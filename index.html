<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Odds Ticker</title>
  <meta name="viewport" content="width=1920, height=270, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <style>
    /* Exact signage canvas */
    html, body {
      margin: 0;
      width: 1920px;
      height: 270px;
      overflow: hidden;
      background: black;
    }

    /* Bottom band */
    #ticker-band {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1920px;
      height: 270px;          /* CapperTek native height */
      background: white;
    }

    iframe {
      width: 1920px;
      height: 270px;
      border: 0;
      display: block;
      background: white;
    }
  </style>
</head>

<body>
  <div id="ticker-band">
    <!-- CapperTek horizontal ticker -->
    <iframe
      src="https://cappertek.com/xAjaxEventsCarousel.asp?ref=widget"
      frameborder="0"
      marginwidth="0"
      marginheight="0"
      scrolling="no"
      style="width: 1920px; height: 270px; margin: 0; padding: 0; background-color: white;">
    </iframe>
  </div>

  <script>
    /* Optional: refresh periodically for 24/7 signage stability */
    const reloadMinutes = 60; // set to 0 to disable

    if (reloadMinutes > 0) {
      setTimeout(() => location.reload(), reloadMinutes * 60 * 1000);
    }
  </script>
</body>
</html>
