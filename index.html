<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Odds Ticker</title>

  <!-- Make the page itself match the ticker size -->
  <meta name="viewport" content="width=1920, height=90, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <style>
    html, body {
      margin: 0;
      width: 1920px;
      height: 90px;     /* match native ticker */
      overflow: hidden;
      background: white;
    }

    iframe {
      width: 1920px;
      height: 90px;
      border: 0;
      display: block;
      background: white;
    }
  </style>
</head>

<body>
  <iframe
    src="https://cappertek.com/xAjaxEventsCarousel.asp?ref=widget"
    frameborder="0"
    marginwidth="0"
    marginheight="0"
    scrolling="yes"
    style="width: 1920px; height: 90px; margin: 0; padding: 0; background-color: white;">
  </iframe>

  <script>
    /* Optional: refresh periodically for 24/7 signage stability */
    const reloadMinutes = 60; // set to 0 to disable
    if (reloadMinutes > 0) {
      setTimeout(() => location.reload(), reloadMinutes * 60 * 1000);
    }
  </script>
</body>
</html>
